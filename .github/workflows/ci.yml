name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  stage-7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_DB: rag_app_test
      POSTGRES_USER: rag_app_test
      POSTGRES_PASSWORD: ci-only-stage-1-password
      POSTGRES_PORT: "5432"
      POSTGRES_URL: postgresql://rag_app_test:ci-only-stage-1-password@localhost:5432/rag_app_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependency imports
        run: >-
          python -c "from google import genai; import docx, dotenv, pgvector,
          psycopg, pypdf, pytest, pytest_cov, spacy, typer"

      - name: Verify CLI help
        run: |
          python -m rag_app.cli --help
          python index_documents.py --help
          python search.py --help

      - name: Verify deterministic synthetic fixtures
        run: |
          python tests/fixtures/generate_fixtures.py
          git diff --exit-code -- tests/fixtures

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL and wait for health
        run: docker compose up --detach --wait --wait-timeout 90 postgres

      - name: Verify PostgreSQL container health
        run: test "$(docker inspect --format='{{.State.Health.Status}}' jeen-rag-postgres)" = "healthy"

      - name: Verify automatic first-volume schema
        run: python -m rag_app.cli database-check

      - name: Initialize schema twice
        run: |
          python -m rag_app.cli database-init
          python -m rag_app.cli database-init

      - name: Verify complete database readiness
        run: python -m rag_app.cli database-check

      - name: Run Stage 1 through Stage 7 unit tests with mocked Gemini
        run: python -m coverage run --source=rag_app -m pytest tests/unit

      - name: Run database integration tests
        run: python -m coverage run --append --source=rag_app -m pytest tests/integration

      - name: Verify test coverage
        run: python -m coverage report --fail-under=80

      - name: Stop disposable PostgreSQL environment
        if: always()
        run: docker compose down --volumes
