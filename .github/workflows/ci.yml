name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify dependency imports
        run: >-
          python -c "from google import genai; import docx, dotenv, pgvector,
          psycopg, pypdf, pytest, pytest_cov, spacy, typer"

      - name: Verify CLI help
        run: |
          python -m rag_app.cli --help
          python index_documents.py --help
          python search.py --help

      - name: Run tests
        run: python -m pytest
