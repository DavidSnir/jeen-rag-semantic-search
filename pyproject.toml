[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "htmlcov",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["rag_app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
